services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - path: /run/base44/app.env
        required: false
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null --max-time 10 http://localhost:3000/ || exit 1"]
      interval: 20s
      timeout: 12s
      retries: 5
      start_period: 240s

volumes:
  node_modules:
  next_cache:
