name: Expodia quality checks

on:
  push:
    branches:
      - feat/ai-operating-platform
  pull_request:
    branches:
      - main
      - feat/ai-operating-platform

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
